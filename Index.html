<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Apro Obsidian…</title>
<style>
  :root { color-scheme: light dark }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, sans-serif; background: #0b1020; color: #eef2ff; padding: 0 max(16px, env(safe-area-inset-left, 0px)) }
  main { max-width: 32rem; text-align: center }
  a { color: #c9d6ff }
  small { opacity: .7 }
</style>
</head>
<body>
<main>
  <p id="msg">Apro la nota in Obsidian…</p>
  <p><a id="link" href="#">Se non si apre, tocca qui</a></p>
  <p><small>Questa pagina non riceve né salva nulla: il nome della nota resta nel tuo browser (è dopo il simbolo #).</small></p>
</main>
<script>
  // Rimanda a Obsidian. Il percorso arriva dopo il #, che il browser non invia al server.
  // Formato: #vault=second-brain&file=aziende/blackship/...
  (function () {
    var p = new URLSearchParams(location.hash.slice(1)), vault = p.get("vault") || "second-brain", file = p.get("file") || "";
    var msg = document.getElementById("msg"), link = document.getElementById("link");
    if (!file || /[\u0000-\u001f]/.test(file)) { msg.textContent = "Manca la nota da aprire."; link.hidden = true; return; }
    var url = "obsidian://open?vault=" + encodeURIComponent(vault) + "&file=" + encodeURIComponent(file);
    link.href = url;
    location.href = url;
    setTimeout(function () { msg.textContent = "Obsidian dovrebbe essersi aperto: puoi chiudere questa scheda."; }, 1500);
  })();
</script>
</body>
</html>
